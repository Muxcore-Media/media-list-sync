name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: core
          repository: Muxcore-Media/core
      - uses: actions/checkout@v7
        with:
          path: media-automation
          repository: Muxcore-Media/media-automation
      - uses: actions/checkout@v7
        with:
          path: media-movies
          repository: Muxcore-Media/media-movies
      - uses: actions/checkout@v7
        with:
          path: media-root-folders
          repository: Muxcore-Media/media-root-folders
      - uses: actions/checkout@v7
        with:
          path: media-tvshows
          repository: Muxcore-Media/media-tvshows
      - uses: actions/checkout@v7
        with:
          path: metadata-tmdb
          repository: Muxcore-Media/metadata-tmdb
      - uses: actions/checkout@v7
        with:
          path: media-list-sync
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ./media-list-sync
          args: --timeout 120s

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: core
          repository: Muxcore-Media/core
      - uses: actions/checkout@v7
        with:
          path: media-automation
          repository: Muxcore-Media/media-automation
      - uses: actions/checkout@v7
        with:
          path: media-movies
          repository: Muxcore-Media/media-movies
      - uses: actions/checkout@v7
        with:
          path: media-root-folders
          repository: Muxcore-Media/media-root-folders
      - uses: actions/checkout@v7
        with:
          path: media-tvshows
          repository: Muxcore-Media/media-tvshows
      - uses: actions/checkout@v7
        with:
          path: metadata-tmdb
          repository: Muxcore-Media/metadata-tmdb
      - uses: actions/checkout@v7
        with:
          path: media-list-sync
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - working-directory: ./media-list-sync
        run: go test -race -count=1 -timeout 60s ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: core
          repository: Muxcore-Media/core
      - uses: actions/checkout@v7
        with:
          path: media-automation
          repository: Muxcore-Media/media-automation
      - uses: actions/checkout@v7
        with:
          path: media-movies
          repository: Muxcore-Media/media-movies
      - uses: actions/checkout@v7
        with:
          path: media-root-folders
          repository: Muxcore-Media/media-root-folders
      - uses: actions/checkout@v7
        with:
          path: media-tvshows
          repository: Muxcore-Media/media-tvshows
      - uses: actions/checkout@v7
        with:
          path: metadata-tmdb
          repository: Muxcore-Media/metadata-tmdb
      - uses: actions/checkout@v7
        with:
          path: media-list-sync
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - working-directory: ./media-list-sync
        run: |
          go build -o /dev/null ./cmd/module
          go vet ./...
