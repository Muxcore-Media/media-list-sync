name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: core
          repository: Muxcore-Media/core
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-automation
          repository: Muxcore-Media/media-automation
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-movies
          repository: Muxcore-Media/media-movies
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-root-folders
          repository: Muxcore-Media/media-root-folders
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-tvshows
          repository: Muxcore-Media/media-tvshows
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: metadata-tmdb
          repository: Muxcore-Media/metadata-tmdb
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-list-sync
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - working-directory: ./media-list-sync
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: core
          repository: Muxcore-Media/core
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-automation
          repository: Muxcore-Media/media-automation
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-movies
          repository: Muxcore-Media/media-movies
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-root-folders
          repository: Muxcore-Media/media-root-folders
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-tvshows
          repository: Muxcore-Media/media-tvshows
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: metadata-tmdb
          repository: Muxcore-Media/metadata-tmdb
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-list-sync
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - working-directory: ./media-list-sync
        run: go test -race -count=1 -timeout 10m ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: core
          repository: Muxcore-Media/core
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-automation
          repository: Muxcore-Media/media-automation
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-movies
          repository: Muxcore-Media/media-movies
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-root-folders
          repository: Muxcore-Media/media-root-folders
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-tvshows
          repository: Muxcore-Media/media-tvshows
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: metadata-tmdb
          repository: Muxcore-Media/metadata-tmdb
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-list-sync
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - working-directory: ./media-list-sync
        run: |
          go build -o /dev/null ./cmd/module
          go vet ./...
